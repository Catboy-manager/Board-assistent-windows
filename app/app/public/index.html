<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>NeuroBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="bg-glass" aria-hidden="true"></div>
  <header class="app-header">
    <div class="header-left">
      <div class="brand">
        <span class="brand-logo">◈</span>
        <span class="brand-name">NeuroBoard</span>
      </div>
      <nav class="nav-pill" id="main-nav">
        <button class="nav-btn active" data-view="dashboard">Дашборд</button>
        <button class="nav-btn" data-view="kanban">Канбан</button>
        <button class="nav-btn" data-view="smart">Умный дом</button>
        <button class="nav-btn" data-view="media">Медиа</button>
        <button class="nav-btn" data-view="tools">Инструменты</button>
      </nav>
    </div>
    <div class="header-right">
      <div class="theme-switch">
        <button class="theme-btn" data-theme-toggle title="Переключить тему">◑</button>
      </div>
      <div class="notify-indicator" id="notify-indicator" title="Уведомления">
        <span class="bell">🔔</span>
        <span class="badge hidden" id="notify-badge">0</span>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-kanban"></section>
    <section class="view" id="view-smart"></section>
    <section class="view" id="view-media"></section>
    <section class="view" id="view-tools"></section>
  </main>

  <div id="toast-container" class="toast-container"></div>
  <audio id="notif-sound" preload="auto"></audio>

  <script src="/js/core/theme.js"></script>
  <script src="/js/core/app.js"></script>
  <script src="/js/core/nav.js"></script>
  <script src="/js/core/notify-sound.js"></script>
</body>
</html>
