<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>NeuroBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="bg-glass" aria-hidden="true"></div>
  <header class="app-header">
    <div class="header-left">
      <div class="brand">
        <span class="brand-logo">◈</span>
        <span class="brand-name">NeuroBoard</span>
      </div>
      <nav class="nav-pill" id="main-nav">
        <button class="nav-btn active" data-view="dashboard">Дашборд</button>
        <button class="nav-btn" data-view="kanban">Канбан</button>
        <button class="nav-btn" data-view="smart">Умный дом</button>
        <button class="nav-btn" data-view="media">Медиа</button>
        <button class="nav-btn" data-view="tools">Инструменты</button>
      </nav>
    </div>
    <div class="header-right">
      <div class="theme-switch">
        <button class="theme-btn" data-theme-toggle title="Переключить тему">◑</button>
      </div>
      <div class="notify-indicator" id="notify-indicator" title="Уведомления">
        <span class="bell">🔔</span>
        <span class="badge hidden" id="notify-badge">0</span>
      </div>
    </div>
  </header>

  <main class="app-main">
    <section class="view active" id="view-dashboard">
      <div class="dashboard-grid">
        <article class="dash-card" data-module="movies"><div class="dash-card-header"><h3>Фильмы</h3></div><div class="dash-card-body" id="w-movies"></div></article>
        <article class="dash-card" data-module="news"><div class="dash-card-header"><h3>Новости</h3></div><div class="dash-card-body" id="w-news"></div></article>
        <article class="dash-card" data-module="music"><div class="dash-card-header"><h3>Музыка</h3></div><div class="dash-card-body" id="w-music"></div></article>
        <article class="dash-card" data-module="youtube"><div class="dash-card-header"><h3>YouTube</h3></div><div class="dash-card-body" id="w-youtube"></div></article>
        <article class="dash-card" data-module="smart"><div class="dash-card-header"><h3>Умный дом</h3></div><div class="dash-card-body" id="w-smart"></div></article>
        <article class="dash-card" data-module="notify"><div class="dash-card-header"><h3>Уведомления</h3></div><div class="dash-card-body" id="w-notify"></div></article>
        <article class="dash-card" data-module="games"><div class="dash-card-header"><h3>Игры</h3></div><div class="dash-card-body" id="w-games"></div></article>
        <article class="dash-card" data-module="msgs"><div class="dash-card-header"><h3>Статистика</h3></div><div class="dash-card-body" id="w-msgs"></div></article>
        <article class="dash-card" data-module="stats"><div class="dash-card-header"><h3>Сервер</h3></div><div class="dash-card-body" id="w-stats"></div></article>
        <article class="dash-card" data-module="interests"><div class="dash-card-header"><h3>Интересы</h3></div><div class="dash-card-body" id="w-interests"></div></article>
        <article class="dash-card" data-module="gh"><div class="dash-card-header"><h3>GitHub</h3></div><div class="dash-card-body" id="w-gh"></div></article>
        <article class="dash-card" data-module="console"><div class="dash-card-header"><h3>Консоль</h3></div><div class="dash-card-body" id="w-console"></div></article>
        <article class="dash-card" data-module="files"><div class="dash-card-header"><h3>Файлы</h3></div><div class="dash-card-body" id="w-files"></div></article>
        <article class="dash-card" data-module="ops"><div class="dash-card-header"><h3>Трансляция</h3></div><div class="dash-card-body" id="w-ops"></div></article>
        <article class="dash-card" data-module="assist"><div class="dash-card-header"><h3>ИИ-ассистент</h3></div><div class="dash-card-body" id="w-assist"></div></article>
      </div>
    </section>
    <section class="view" id="view-kanban"></section>
    <section class="view" id="view-smart"></section>
    <section class="view" id="view-media"></section>
    <section class="view" id="view-tools"></section>
  </main>

  <div id="toast-container" class="toast-container"></div>
  <audio id="notif-sound" preload="auto"></audio>

  <script src="/js/core/theme.js"></script>
  <script src="/js/core/app.js"></script>
  <script src="/js/core/nav.js"></script>
  <script src="/js/core/notify-sound.js"></script>
  <script src="/js/core/smart-bridge.js"></script>
  <script src="/js/core/dashboard-loader.js"></script>
  <script src="/js/components/kanban-ui.js"></script>
  <script src="/js/widgets/movies-widget.js"></script>
  <script src="/js/widgets/news-widget.js"></script>
  <script src="/js/widgets/music-widget.js"></script>
  <script src="/js/widgets/youtube-widget.js"></script>
  <script src="/js/widgets/smart-widget.js"></script>
  <script src="/js/widgets/notify-widget.js"></script>
  <script src="/js/widgets/games-widget.js"></script>
  <script src="/js/widgets/msgs-widget.js"></script>
  <script src="/js/widgets/stats-widget.js"></script>
  <script src="/js/widgets/interests-widget.js"></script>
  <script src="/js/widgets/gh-widget.js"></script>
  <script src="/js/widgets/console-widget.js"></script>
  <script src="/js/widgets/files-widget.js"></script>
  <script src="/js/widgets/ops-widget.js"></script>
  <script src="/js/widgets/assist-widget.js"></script>
  <script src="/js/movies.js"></script>
  <script src="/js/news.js"></script>
  <script src="/js/music.js"></script>
  <script src="/js/youtube.js"></script>
  <script src="/js/smart.js"></script>
  <script src="/js/notify.js"></script>
  <script src="/js/games.js"></script>
  <script src="/js/msgs.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/interests.js"></script>
  <script src="/js/gh.js"></script>
  <script src="/js/console.js"></script>
  <script src="/js/files.js"></script>
  <script src="/js/ops.js"></script>
  <script src="/js/assist.js"></script>
  <script src="/js/assistant.js"></script>
</body>
</html>
