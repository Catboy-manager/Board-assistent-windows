<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📲 Уведомление на доску</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #101418; color: #e8edf2; min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 30px; }
  h1 { font-size: 19px; margin: 0 0 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  label { display: block; font-size: 12px; color: #9aa7b4; margin: 12px 0 6px; font-weight: 600; }
  input, textarea { width: 100%; box-sizing: border-box; background: #1b222a; border: 1px solid #2c3742; color: #e8edf2; border-radius: 10px; padding: 12px; font-size: 15px; }
  textarea { min-height: 96px; resize: vertical; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  button { flex: 1; background: #2f6f4f; border: 0; color: #fff; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; }
  button.reset { flex: 0 0 auto; background: #2c3742; padding: 14px 18px; }
  button:active { transform: scale(.97); }
  #status { margin-top: 14px; font-size: 14px; border-radius: 10px; padding: 12px; display: none; background: #1b2a22; color: #8fd6a8; }
  #status.err { background: #2a1b1b; color: #f0a8a0; }
  .hint { margin-top: 18px; font-size: 12px; color: #7c8a97; line-height: 1.6; }
  kbd { background: #1b222a; border: 1px solid #2c3742; border-radius: 5px; padding: 1px 6px; font-family: monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📲 На доску</h1>
  <label>Заголовок</label>
  <input id="title" type="text" placeholder="Например: 📦 Посылка у двери">
  <label>Текст</label>
  <textarea id="text" placeholder="Оставь себе напоминание, которое покажется на доске"></textarea>
  <div class="row">
    <button id="send">➤ Отправить</button>
    <button class="reset" id="clear" title="Очистить">🗑</button>
  </div>
  <div id="status"></div>
  <div class="hint">
    Сообщение появится всплывающим уведомлением на доске в браузере (нужна открытая вкладка).<br>
    Ключ задаётся переменной окружения <kbd>KANBAN_NOTIFY_KEY</kbd> на сервере.
  </div>
</div>
<script>
(function () {
  var s = document.getElementById('status');
  function set(msg, err) {
    s.textContent = msg;
    s.className = err ? 'err' : '';
    s.style.display = 'block';
    setTimeout(function () { s.style.display = 'none'; }, 5000);
  }
  document.getElementById('send').addEventListener('click', async function () {
    var title = document.getElementById('title').value.trim();
    var text = document.getElementById('text').value.trim();
    if (!title && !text) { set('Заполни хотя бы одно поле', true); return; }
    try {
      var r = await fetch('/api/notify/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, text: text, app: 'Телефон' })
      });
      var d = await r.json();
      if (d.ok) { set('✓ Отправлено'); document.getElementById('text').value = ''; }
      else set(d.error || ('Ошибка ' + r.status), true);
    } catch (e) { set('Сеть недоступна', true); }
  });
  document.getElementById('clear').addEventListener('click', function () {
    document.getElementById('title').value = '';
    document.getElementById('text').value = '';
  });
})();
</script>
</body>
</html>
